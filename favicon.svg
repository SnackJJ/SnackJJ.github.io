<!-- Pixel "Z" favicon — Flexoki palette.
     Ink tile + paper pixel Z; the top-right stroke tip is the Yellow accent.
     All coordinates are even so the glyph stays crisp at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="6" fill="#100F0F"/>
  <!-- top bar (right tip in Yellow) -->
  <rect x="6" y="6" width="16" height="4" fill="#FFFCF0"/>
  <rect x="22" y="6" width="4" height="4" fill="#AD8301"/>
  <!-- diagonal -->
  <rect x="20" y="10" width="4" height="4" fill="#FFFCF0"/>
  <rect x="18" y="12" width="4" height="4" fill="#FFFCF0"/>
  <rect x="16" y="14" width="4" height="4" fill="#FFFCF0"/>
  <rect x="14" y="16" width="4" height="4" fill="#FFFCF0"/>
  <rect x="12" y="18" width="4" height="4" fill="#FFFCF0"/>
  <rect x="10" y="20" width="4" height="4" fill="#FFFCF0"/>
  <!-- bottom bar -->
  <rect x="6" y="22" width="20" height="4" fill="#FFFCF0"/>
</svg>

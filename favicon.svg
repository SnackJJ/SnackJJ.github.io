<!-- Pixel "Ze" favicon — Flexoki palette.
     Big pixel Z + small subscript E tucked into the bottom-right
     ("Ze" for 泽). Paper glyphs on an ink tile; no accent colors.
     All coordinates are even so the glyph stays crisp at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="6" fill="#100F0F"/>
  <!-- big Z -->
  <rect x="2" y="4" width="20" height="4" fill="#FFFCF0"/>
  <rect x="16" y="8" width="4" height="4" fill="#FFFCF0"/>
  <rect x="14" y="10" width="4" height="4" fill="#FFFCF0"/>
  <rect x="12" y="12" width="4" height="4" fill="#FFFCF0"/>
  <rect x="10" y="14" width="4" height="4" fill="#FFFCF0"/>
  <rect x="8" y="16" width="4" height="4" fill="#FFFCF0"/>
  <rect x="6" y="18" width="4" height="4" fill="#FFFCF0"/>
  <rect x="2" y="20" width="20" height="4" fill="#FFFCF0"/>
  <!-- small E (subscript, top bar aligned with Z's bottom bar) -->
  <rect x="25" y="20" width="2" height="10" fill="#FFFCF0"/>
  <rect x="25" y="20" width="5" height="2" fill="#FFFCF0"/>
  <rect x="25" y="24" width="4" height="2" fill="#FFFCF0"/>
  <rect x="25" y="28" width="5" height="2" fill="#FFFCF0"/>
</svg>
